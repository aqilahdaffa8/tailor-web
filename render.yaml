services:
  - type: web
    name: tailor-web
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_NAME
        value: "Tailor Management System"
      - key: APP_ENV
        value: "production"
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: "id"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: "stderr"
      - key: TRUSTED_PROXIES
        value: "*"
      - key: DB_CONNECTION
        value: "mysql"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA_PEM
        sync: false
      - key: PUBLIC_DISK_DRIVER
        value: "s3"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: "auto"
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_URL
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "false"
      - key: CRON_TOKEN
        sync: false
